name: CI

# Every pull request into main must pass these checks before it can be merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  boundaries:
    name: Architecture boundaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Self-test the boundary script
        shell: pwsh
        run: ./scripts/check-boundaries.ps1 -SelfTest
      - name: Domain crates stay free of engine, UI, network and database
        shell: pwsh
        run: ./scripts/check-boundaries.ps1

  # Everything except the game builds on Linux, which is faster and cheaper than Windows.
  crates:
    name: Rust crates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (whole workspace)
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude trainer --all-targets --profile ci -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude trainer --profile ci

  # The game reads raw input through Win32, so it is checked on Windows.
  trainer:
    name: Trainer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p trainer --all-targets --profile ci -- -D warnings
      - name: Tests
        run: cargo test -p trainer --profile ci

  desktop:
    name: Desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install UI packages
        working-directory: apps/desktop/ui
        run: npm ci --no-audit --no-fund
      # Type-checks the UI, and produces the dist folder the Tauri backend embeds at compile time.
      - name: Build UI
        working-directory: apps/desktop/ui
        run: npm run build
      - name: Formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --profile ci -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --profile ci
