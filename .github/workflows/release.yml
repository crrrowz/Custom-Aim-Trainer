name: Release

# Pushing a version tag (for example v0.1.0) builds the Windows installer and the portable zip and
# attaches them to a draft GitHub release. Review the draft and publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Both Cargo workspaces (the root one and apps/desktop/src-tauri) build into ./target here.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install UI packages
        run: npm ci --prefix apps/desktop/ui --no-audit --no-fund
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }
      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: aimforge-windows
          path: dist/*.*
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --draft --title "AimForge ${{ github.ref_name }}" --notes-file docs/release-notes.md @files
          } else {
            gh release upload "${{ github.ref_name }}" @files --clobber
          }
