[workspace]
resolver = "2"
exclude = ["apps/desktop/src-tauri"]
members = [
    "crates/aim-core",
    "crates/aim-telemetry",
    "crates/aim-scenarios",
    "crates/aim-analysis",
    "crates/aim-coach",
    "crates/aim-store",
    "crates/aim-sync",
    "crates/aim-llm",
    "crates/aim-wasm",
    "apps/trainer",
    "tools/aft-dump",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AimForge Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.0", features = ["alloc"] }
zstd = "0.13"
crc32fast = "1.4"
proptest = "1.5"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same speed in the game as release, without the slow final optimisation step.
[profile.play]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

# Used only by CI: no optimisation and no debug info, so a cold build is much faster.
# Local builds keep the dev profile above, and the game is built with the play profile.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

[profile.ci.package."*"]
opt-level = 0
